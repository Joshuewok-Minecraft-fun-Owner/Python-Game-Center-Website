<!DOCTYPE html>
<html>
<head>
  <title>Python Game</title>
</head>
<body>
  <h1>Python Text Game</h1>

  <button onclick="runGame()">Run Game</button>
  <pre id="output"></pre>

  <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>

  <script>
    let pyodideReady = loadPyodide();

    async function runGame() {
      let pyodide = await pyodideReady;

      let code = `
print("Welcome to the guessing game!")
import random
num = random.randint(1, 5)
guess = 3  # pretend user input
print("You guessed:", guess)
print("Number was:", num)
print("Win!" if guess == num else "Try again!")
      `;

      let result = pyodide.runPython(code);
      document.getElementById("output").textContent = "Game ran!";
    }
  </script>
</body>
</html>
