<!DOCTYPE html>
<html>
<head>
  <title>Pyodide GitHub Loader</title>
</head>
<body>
  <h1>Python Game Loader TEMPLATE</h1>
  <button onclick="runGame()">Run Game</button>

  <pre id="output"></pre>

  <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>

  <script>
    let pyodideReady = loadPyodide();

    async function runGame() {
      let pyodide = await pyodideReady;

      // 🔥 load Python file from GitHub
      let response = await fetch(
        "https://raw.githubusercontent.com/USERNAME/REPO/main/game.py"
      );

      let pythonCode = await response.text();

      // optional: redirect print output to browser
      pyodide.runPython(`
import sys
class Output:
    def write(self, s):
        document.getElementById("output").textContent += s
sys.stdout = Output()
      `);

      pyodide.runPython(pythonCode);
    }
  </script>
</body>
</html>
